<!DOCTYPE html>
<html>
<head>
  <title>wheelchair-accessible-navigation-system</title>
  <meta charset="utf-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
   #container {
      position: relative;
      width: 640px;
      height: 480px;
      margin-bottom: 20px;
    }

    #videoElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      z-index: 1;
    }

    .box {
      position: absolute;
      border: 2px solid red;
      color: red;
      font-size: 14px;
      font-weight: bold;
      z-index: 2;
      pointer-events: none;
    }

    #map {
      height: 80vh;
      width: 100%;
    }

    #buttons {
      margin: 10px;
    }
  </style>
</head>

<body class="container py-4">
  <h2>♿ Wheelchair Accessibility & Navigation + YOLO Detection</h2>

  <!-- Coordinate Input -->
  <div id="buttons" class="mb-4">
    <button class="btn btn-primary btn-lg rounded-pill me-2 mb-2" onclick="setTarget(1)">Set Start Point</button>
    <input class="form-control form-control-lg rounded-pill d-inline w-auto me-2 mb-2" id="lat1" placeholder="Start Latitude" />
    <input class="form-control form-control-lg rounded-pill d-inline w-auto mb-2" id="lng1" placeholder="Start Longitude" />
    <br>
    <button class="btn btn-success btn-lg rounded-pill me-2 mb-2" onclick="setTarget(2)">Set Destination</button>
    <input class="form-control form-control-lg rounded-pill d-inline w-auto me-2 mb-2" id="lat2" placeholder="Destination Latitude" />
    <input class="form-control form-control-lg rounded-pill d-inline w-auto mb-2" id="lng2" placeholder="Destination Longitude" />
  </div>

  <!-- Google Map -->
  <div id="map"></div>

  <!-- Route Mode Selection -->
 <div class="mb-5" >
    <h2>Route Selection</h2>
    <button class="btn btn-warning btn-lg rounded-pill me-2 mb-2" onclick="showDrivingRoute()">Efficient Mode (Fastest)</button>
    <button class="btn btn-info btn-lg rounded-pill mb-2" onclick="showTransitRoute()">Safe Mode (Public Transit)</button>
    <p id="route-output" class="fw-bold fs-5 mt-2"></p>
  </div>

  <!-- Proximity Alert -->
  <div>
    <h2>📡 Real-Time Proximity Alert</h2>
    <p id="proximity-status" style="font-weight: bold; font-size: 16px;"></p>
  </div>

  <!-- YOLO Detection -->
  <div>
    <h2>Real-Time Object Detection</h2>
    <div id="container">
      <video autoplay="true" id="videoElement" playsinline></video>
      <!-- Bounding boxes (.box) will be dynamically inserted here -->
    </div>
  </div>

  <!-- Support Services -->
  <div>
    <h2>Support Services</h2>
    <button onclick="contactsystem(this)">Contact Boston 311</button>
    <button onclick="contactsystem(this)">Contact Wonders in Reach</button>
    <button onclick="contactsystem(this)">ADA Ramp Access Form</button>
    <p id="contact-support" style="font-weight: bold; font-size: 18px;"></p>
  </div>

  <!-- Contribution -->
  <div>
    <h2>Contribute</h2>
    <button onclick="contributedatasystem(this)">Click here to create more boundless cities!</button>
    <p id="join-the-movement" style="font-weight: bold; font-size: 18px;"></p>
  </div>

  <!-- Google Map API & External Script -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB-I-dlRuOiijTcNZkubsPTv4Pl1AW7GFI&callback=initMap"></script>
  <script src="script.js"></script>
  <script src="button_action.js"></script>

  <!-- YOLO + Webcam + Alert Script -->
  <script>
    const video = document.getElementById("videoElement");
    const container = document.getElementById("container");

    let model;
    let hasDetected = false;
    let detectionCooldown = false;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } })
      .then((stream) => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          detectFrame();
        };
      })
      .catch((err) => {
        console.error("Failed to access webcam:", err);
      });

    async function beepThreeTimes() {
      for (let i = 0; i < 3; i++) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = ctx.createOscillator();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(1000, ctx.currentTime);
        oscillator.connect(ctx.destination);
        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.2);
        await new Promise(r => setTimeout(r, 300));
      }
    }

    function clearBoxes() {
      const oldBoxes = container.querySelectorAll(".box");
      oldBoxes.forEach(box => box.remove());
    }

    function drawBoxes(predictions) {
      predictions.forEach(pred => {
        const [x, y, width, height] = pred.bbox;

        const box = document.createElement("div");
        box.className = "box";
        box.style.left = `${x}px`;
        box.style.top = `${y}px`;
        box.style.width = `${width}px`;
        box.style.height = `${height}px`;
        box.innerText = `${pred.class} ${Math.round(pred.score * 100)}%`;
        container.appendChild(box);
      });
    }

    async function detectFrame() {
      if (!model) {
        model = await cocoSsd.load();
      }

      const predictions = await model.detect(video);
      clearBoxes();
      drawBoxes(predictions);

      if (!hasDetected && predictions.length > 0 && !detectionCooldown) {
        hasDetected = true;
        detectionCooldown = true;
        beepThreeTimes();

        setTimeout(() => {
          hasDetected = false;
          detectionCooldown = false;
        }, 5000);
      }

      requestAnimationFrame(detectFrame);
    }
  </script>
</body>
</html>
